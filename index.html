<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ซ้อมแผน รพ.ดอนจาน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Mali:wght@600;700&display=swap">
<style>
/* Layout: full-screen 3D canvas; player HUD or admin panel floats on top; lobby and summary are modal sheets */
:root{--sky:#d6f0ff;--ink:#1b2a47;--paper:#ffffff;--soft:#eef6fb;--line:#c9dbe8;--teal:#10b3a3;--teal-d:#0b8a7d;--sun:#ffc93c;--coral:#ff6b57;--ok:#26a269;--warn:#f59f00;--bad:#e03131;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:'Kanit',system-ui,sans-serif;font-size:15px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;-webkit-user-select:text;user-select:text}
.btn{background:var(--teal);color:#fff;font-weight:600;border-radius:14px;padding:10px 16px;box-shadow:0 3px 0 var(--teal-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #d9a514}
.btn.red{background:var(--coral);box-shadow:0 3px 0 #c9483a}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:6px 10px;border-radius:10px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
#tag{position:fixed;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);font-weight:600;font-size:11px;letter-spacing:.12em;padding:2px 12px;border-radius:0 0 10px 10px;z-index:30;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(214,240,255,.92);padding:max(28px,env(safe-area-inset-top,0px)) 16px 24px;touch-action:pan-y}
.sheet[hidden]{display:none}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px;width:min(560px,100%);box-shadow:0 8px 0 rgba(27,42,71,.08);display:grid;gap:14px}
h1{font-family:'Mali',sans-serif;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0}
.sub{margin:0;color:#4b5f7d}
.lab{font-size:12px;letter-spacing:.06em;color:#4b5f7d;font-weight:500}
#roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}
.role{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:left;display:grid;gap:2px;min-width:0}
.role b{font-weight:600}.role small{color:#4b5f7d;line-height:1.25}
.role.on{border-color:var(--teal);background:#e1f8f4;box-shadow:0 0 0 2px var(--teal)}
#looks{display:flex;gap:8px;flex-wrap:wrap}
.look{border-radius:14px;border:3px solid var(--line);padding:8px 22px;background:var(--soft);font-weight:500}
.look.on{border-color:var(--teal);background:#e1f8f4;box-shadow:0 0 0 3px #bfeee8}
#logos{display:flex;align-items:center;gap:12px}
#logos img{max-width:100%;display:block}
#appr{position:fixed;top:max(30px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(430px,92vw);z-index:14;display:grid;gap:8px}
.apr{background:var(--paper);border:3px solid var(--sun);border-radius:16px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 6px 0 rgba(27,42,71,.12)}
#rhf{display:flex;gap:8px}
#conn{font-size:12px;color:#4b5f7d}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#who{position:absolute;top:max(26px,env(safe-area-inset-top,0px));left:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:500}
#who small{display:block;color:#4b5f7d;font-weight:400}
#banner{position:absolute;top:max(26px,env(safe-area-inset-top,0px));right:12px;max-width:min(55vw,360px);background:var(--coral);color:#fff;border-radius:14px;padding:8px 12px;font-weight:500;box-shadow:0 3px 0 #c9483a}
#fs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:45;width:42px;height:42px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:20px;line-height:1;box-shadow:0 3px 0 rgba(27,42,71,.2);opacity:.9}
#tl{position:absolute;top:calc(max(26px,env(safe-area-inset-top,0px)) + 56px);left:12px;display:flex;gap:6px}
body.isadm #tl{left:auto;right:12px;top:max(26px,env(safe-area-inset-top,0px))}
#missions{position:absolute;top:calc(max(26px,env(safe-area-inset-top,0px)) + 104px);left:12px;display:grid;gap:6px;width:min(300px,62vw)}
.msn{background:var(--paper);border:2px solid var(--sun);border-radius:14px;padding:8px 10px;display:grid;gap:6px;font-size:14px}
#joy{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(27,42,71,.2);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:var(--paper);border:3px solid var(--teal);box-shadow:0 3px 0 rgba(27,42,71,.2)}
#acts{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));display:grid;justify-items:end;gap:10px}
#btnAct{width:104px;height:104px;border-radius:50%;background:var(--coral);color:#fff;font-weight:600;font-size:15px;line-height:1.15;box-shadow:0 5px 0 #c9483a;padding:6px}
#btnAct:active{transform:translateY(3px);box-shadow:0 2px 0 #c9483a}
#chat{position:absolute;left:12px;right:12px;bottom:180px;max-width:340px;background:rgba(255,255,255,.92);border:2px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px}
#chatlog{max-height:22vh;overflow-y:auto;font-size:13px;display:grid;gap:3px;touch-action:pan-y}
#toast{position:fixed;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 160px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;z-index:40;max-width:86vw;text-align:center;pointer-events:none}
#adm{position:fixed;z-index:12;background:var(--paper);border:2px solid var(--line);display:grid;grid-template-rows:auto 1fr;overflow:hidden;left:0;top:0;bottom:0;width:min(390px,100vw);border-radius:0 20px 20px 0;padding-top:max(0px,env(safe-area-inset-top,0px));padding-left:max(0px,env(safe-area-inset-left,0px))}
#adm.fold{bottom:auto;width:auto;max-width:100vw;border-radius:0 0 20px 0}#adm.fold #tabbody{display:none}#adm.fold #tabs button:not(#admFold){display:none}
#tabs{display:flex;gap:4px;padding:8px;background:var(--soft);overflow-x:auto}
#tabs button{background:transparent;border-radius:10px;padding:6px 10px;white-space:nowrap;font-weight:500}
#tabs button.on{background:var(--teal);color:#fff}
#tabbody{overflow-y:auto;padding:12px;display:grid;gap:12px;align-content:start;touch-action:pan-y}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--soft);border:1px solid var(--line)}
.pill.run{background:#d3f9e4;border-color:#8fd9ae}.pill.pause{background:#fff0c2;border-color:#f1cf68}.pill.end{background:#ffe0dc;border-color:#f5a399}
.list{display:grid;gap:6px}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--soft);border:2px solid transparent;border-radius:12px;padding:6px 10px}
.it.on{border-color:var(--teal)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.tw{overflow-x:auto}
#sumbody{display:grid;gap:14px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
#qr{background:#fff;padding:10px;border-radius:12px;width:fit-content}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--teal);height:28px}
#camset{position:absolute;right:12px;bottom:180px;width:min(250px,70vw);background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:4px}
#fin{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(27,42,71,.85));color:#fff}
#fin[hidden]{display:none}
#fincap{font-family:'Mali',sans-serif;font-size:20px;font-weight:700;text-wrap:balance}
body.isadm #joy{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
body.isadm #acts{right:calc(max(16px,env(safe-area-inset-right,0px)) + 158px);align-items:end}
@media(max-width:640px){body.isadm #joy{bottom:calc(46vh + 14px)}body.isadm #acts{bottom:calc(46vh + 14px)}}
.pan-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.pan-h span:last-child{display:flex;gap:6px}
.pan.fold .pan-b{display:none}
@media(max-width:640px){#adm{top:auto;left:0;width:100%;height:46vh;border-radius:20px 20px 0 0;padding-right:max(0px,env(safe-area-inset-right,0px))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ===== ตัวแปลงห้องซ้อม: Firebase Realtime Database แทนระบบห้องของ Claude ===== */
(function(){
 const CFG=window.FB_CONFIG;
 const ok=!!(CFG&&CFG.databaseURL&&!/YOUR_|ใส่/.test(JSON.stringify(CFG))&&typeof firebase!=='undefined');
 const STATE=['st','msn'];
 function makeRoom(db,code){
  const myId=Math.random().toString(36).slice(2,10);
  const base=db.ref('rooms/'+code),cache=new Map(),handlers={},stateOn={},connCb=[],mine={};
  let offset=0,conn=false;const now=()=>Date.now()+offset;
  db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0});
  db.ref('.info/connected').on('value',s=>{conn=!!s.val();
   if(conn){base.child('p/'+myId).onDisconnect().remove();if(Object.keys(mine).length)base.child('p/'+myId).update(Object.assign({ts:Date.now()},mine))}
   connCb.forEach(f=>{try{f(conn)}catch(e){}})});
  const pRef=base.child('p');
  const setP=s=>{const v=s.val();if(v)cache.set(s.key,{presence:v,rt:Date.now()})};
  pRef.on('child_added',setP);pRef.on('child_changed',setP);pRef.on('child_removed',s=>{cache.delete(s.key)});
  const deliver=(topic,o)=>{(handlers[topic]||[]).slice().forEach(f=>{try{f({data:o.d,peer:o.f,isMe:o.f===myId,sameTab:o.f===myId})}catch(e){console.error(e)}})};
  base.child('ev').limitToLast(40).on('child_added',s=>{const o=s.val();if(!o||!o.k||Math.abs(now()-o.t)>6000)return;deliver(o.k,o)});
  return {
   peers(){const arr=[],t=Date.now();let me=false;
    cache.forEach((v,k)=>{if(k===myId)me=true;else if(v.presence.r&&t-v.rt>25000)return;
     arr.push({peer:k,isMe:k===myId,sameTab:k===myId,kind:'viewer',presence:v.presence})});
    if(!me)arr.push({peer:myId,isMe:true,sameTab:true,kind:'viewer',presence:Object.assign({},mine)});
    return arr},
   presence(patch){
    for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}
    cache.set(myId,{presence:Object.assign({},mine),rt:Date.now()});
    return Promise.resolve(base.child('p/'+myId).update(Object.assign({},patch,{ts:Date.now()})))},
   emit(topic,data){
    const o={f:myId,d:data,t:firebase.database.ServerValue.TIMESTAMP,k:topic};
    if(STATE.includes(topic))return Promise.resolve(base.child('s/'+topic).set(o));
    const r=base.child('ev').push();const p=r.set(o);setTimeout(()=>{try{r.remove()}catch(e){}},15000);return Promise.resolve(p)},
   on(topic,fn){
    (handlers[topic]=handlers[topic]||[]).push(fn);
    if(STATE.includes(topic)&&!stateOn[topic]){stateOn[topic]=1;
     base.child('s/'+topic).on('value',s=>{const o=s.val();if(o&&Math.abs(now()-o.t)<10000)deliver(topic,o)})}
    return()=>{const a=handlers[topic];const i=a.indexOf(fn);if(i>=0)a.splice(i,1)}},
   onConnection(fn){connCb.push(fn);try{fn(conn)}catch(e){}return()=>{const i=connCb.indexOf(fn);if(i>=0)connCb.splice(i,1)}},
   connected:()=>conn
  };
 }
 window.__makeRoom=makeRoom;
 let room=null;
 if(ok){try{firebase.initializeApp(CFG);const code=(new URLSearchParams(location.search).get('room')||'main').replace(/[^\w-]/g,'').slice(0,24)||'main';room=makeRoom(firebase.database(),code)}catch(e){console.error(e)}}
 window.claude={use:async n=>{
  if(n==='room')return room;
  if(n==='user')return {canEdit:()=>true,isOwner:()=>true};
  if(n==='downloads')return {save:({filename,data})=>{const b=new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return Promise.resolve({status:'saved'})}};
  return null}};
})();

/* collision */
function collide(p,r,ign){
 const one=c=>{const cx=Math.max(c[0],Math.min(p.x,c[2])),cz=Math.max(c[1],Math.min(p.z,c[3]));
  let dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;if(d2<r*r){if(d2<1e-6){p.x+=r;return}const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r}};
 for(const c of colliders)one(c);
 if(!ign)for(const c of closedDoors)one(c);
 p.x=Math.max(-60,Math.min(60,p.x));p.z=Math.max(-26,Math.min(48,p.z));
}

/* local player movement */
let autoPath=[],autoRun=false,onArrive=null,hid=false,fightUntil=0;
function cancelAuto(){autoPath=[];onArrive=null}
function goPath(x,z,r,cb){autoPath=routeTo(pos.x,pos.z,x,z).map(p=>[p[0],p[1]]);autoRun=!!r;onArrive=cb||null;hid=false}
function movePlayer(dt){
 let ix=jx,iy=jy;
 if(key.KeyA||key.ArrowLeft)ix-=1;if(key.KeyD||key.ArrowRight)ix+=1;if(key.KeyW||key.ArrowUp)iy-=1;if(key.KeyS||key.ArrowDown)iy+=1;
 const m=Math.min(1,Math.hypot(ix,iy));let sp=0;
 const blocked=frozen||phase==='pause'||performance.now()<fightUntil;
 if(mode==='player'&&!blocked&&m<=.08&&autoPath.length){
  const g=autoPath[0],ax=g[0]-pos.x,az=g[1]-pos.z,ad=Math.hypot(ax,az);
  if(ad<.45){autoPath.shift();if(!autoPath.length&&onArrive){const f=onArrive;onArrive=null;f()}}
  else{sp=autoRun?5.6:3.4;pos.x+=ax/ad*sp*dt;pos.z+=az/ad*sp*dt;collide(pos,.45,hid);collide(pos,.45,hid);pos.ry=angLerp(pos.ry,Math.atan2(ax,az),Math.min(1,dt*14))}
 }else if(m>.08&&!blocked){
  if(mode==='player'&&(autoPath.length||hid)){autoPath=[];onArrive=null;hid=false}
  const dx=Math.cos(camYaw)*ix+Math.sin(camYaw)*iy,dz=-Math.sin(camYaw)*ix+Math.cos(camYaw)*iy,l=Math.hypot(dx,dz)||1;
  const spd=(run||key.ShiftLeft||key.ShiftRight)?5.6:3.2;sp=spd*m;
  if(mode==='player'){pos.x+=dx/l*sp*dt;pos.z+=dz/l*sp*dt;collide(pos,.45);pos.ry=angLerp(pos.ry,Math.atan2(dx,dz),Math.min(1,dt*14))}
  else adminMove(dx/l,dz/l,sp,dt);
 }
 pos.spd=sp;
 if(mode==='player'&&myMesh){
  const tt=performance.now()/1000;myMesh.rotation.y=pos.ry;myMesh.position.set(pos.x,0,pos.z);
  animChar(myMesh,sp,tt,hid?'sit':'');
  if(performance.now()<fightUntil){myMesh.userData.armR.rotation.x=-1.7+Math.sin(tt*16)*.7;myMesh.userData.armL.rotation.x=-1.7+Math.cos(tt*16)*.7}
  camT.x+=(pos.x-camT.x)*Math.min(1,dt*8);camT.z+=(pos.z-camT.z)*Math.min(1,dt*8)}
}
/* หนี ซ่อน สู้ ของผู้เล่น */
function medNear(x,z,r){for(const v of npcView.values()){if(NT[v.tp].need==='med'&&Math.hypot(v.x-x,v.z-z)<r)return true}return false}
function pickHide(px,pz){
 const sus=[...npcView.values()].filter(v=>v.tp==='suspect'&&!(v.fl&8));let best=null,bs=1e9;
 for(const h of HIDE){let sc=Math.hypot(h[0]-px,h[1]-pz);
  if(medNear(h[0],h[1],4))sc+=300;
  for(const s of sus){if(zoneOf(s.x,s.z)===zoneOf(h[0],h[1])||Math.hypot(h[0]-s.x,h[1]-s.z)<8)sc+=500}
  if(sc<bs){bs=sc;best=h}}
 return best||HIDE[0];
}
function zigzag(path){
 const out=[];let sgn=Math.random()<.5?1:-1;
 out.push([pos.x+sgn*2.2,pos.z-1.2],[pos.x-sgn*1.6,pos.z+.6]);
 path.forEach((p,i)=>{sgn=-sgn;const last=i===path.length-1;out.push(last?[p[0],p[1]]:[p[0]+sgn*1.4,p[1]+sgn*.8])});
 return out;
}

  const h=pickHide(pos.x,pos.z);
  const path=routeTo(pos.x,pos.z,h[0],h[1]).map(p=>[p[0],p[1]]);
  autoPath=zigzag(path);autoRun=true;hid=false;onArrive=()=>toast('ถึงที่ปลอดภัยแล้ว กด "ซ่อน" เพื่อปิดประตูห้อง',3500);
  toast('ไกลทางออก วิ่งหนีไปพื้นที่ปลอดภัยใกล้ ๆ');
 }

}

 else{goPath(h[0],h[1],true,()=>{hid=true;toast('ซ่อนตัวแล้ว ประตูห้องปิด (ขยับเพื่อออก)')});toast('วิ่งไปซ่อน')}

addEventListener('resize',resize);resize();
let last=performance.now(),camUITick=0;
let fpsN=0,fpsT=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 fpsN++;if(now-fpsT>2500){const fps=fpsN*1000/(now-fpsT);fpsN=0;fpsT=now;if(fps<22&&PR>.5){PR=Math.max(.5,PR*.75);renderer.setPixelRatio(PR);resize();toast('เครื่องช้า ลดความละเอียดภาพอัตโนมัติ',2500)}}
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 if(mode)movePlayer(dt);
 if(mode==='admin')adminTick(dt,t);
 syncPresence(t);
 updateViews(dt,t);
 if(fin.on)updateFinale(dt,t);
 const lobbyShown=!mode;
 const tx=lobbyShown?Math.sin(t*.1)*10:camT.x,tz=lobbyShown?4:camT.z;
 const yaw=lobbyShown?t*.12:camYaw,d=lobbyShown?26:camDist,pc=lobbyShown?.7:camPitch;
 if(!fin.on){camera.position.set(tx+Math.sin(yaw)*Math.cos(pc)*d,Math.sin(pc)*d+1,tz+Math.cos(yaw)*Math.cos(pc)*d);
 camera.lookAt(tx,1,tz)}
 if((camUITick=(camUITick||0)+1)%20===0)syncCam();
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);

let fights=[];
function startFight(who){
 const s=npcs.filter(q=>q.tp==='suspect'&&!q.gone&&!(q.fl&8)&&!q.fightLock).sort((a,b)=>Math.hypot(a.x-(who.x??who.npc.x),a.z-(who.z??who.npc.z))-Math.hypot(b.x-(who.x??who.npc.x),b.z-(who.z??who.npc.z)))[0];
 if(!s)return {ok:0,m:'ไม่มีผู้ก่อเหตุให้ต่อสู้'};
 const ox=who.npc?who.npc.x:who.x,oz=who.npc?who.npc.z:who.z;
 const f={s,ph:'gather',t:0,tm:0,fs:[],peer:who.peer||null,police:null,go:0};
 if(who.npc)f.fs.push(who.npc);
 const helpers=npcs.filter(q=>!q.gone&&q!==who.npc&&canCmd(q)&&FLEE.includes(q.tp)&&q.st!==3&&!(q.fl&4)&&!q.job&&!q.claim&&Math.hypot(q.x-s.x,q.z-s.z)<14).sort((a,b)=>Math.hypot(a.x-s.x,a.z-s.z)-Math.hypot(b.x-s.x,b.z-s.z)).slice(0,who.npc?2:3);
 f.fs.push(...helpers);
 f.fs.forEach(q=>{q.fighting=1;q.job=null;q.hold=0;q.tx=null;q.fl&=~(64|128|256);q.route=[];sendTo(q,s.x+rnd(-1.4,1.4),s.z+rnd(-1.4,1.4),4)});
 s.fightLock=1;s.mode='still';s.route=[];s.tx=null;s.st=0;
 const pol=npcs.filter(q=>q.tp==='police'&&!q.gone&&!q.esc).sort((a,b)=>Math.hypot(a.x-s.x,a.z-s.z)-Math.hypot(b.x-s.x,b.z-s.z))[0];
 if(pol){f.police=pol;pol.claim=1;sendTo(pol,s.x+rnd(-2,2),s.z+rnd(-2,2),4)}
 if(f.peer){emit('cmd',{to:f.peer,t:'go',x:s.x+1.2,z:s.z,r:1})}
 fights.push(f);RHF.fight++;
 lg('evt',who.npc?NT[who.npc.tp].th+' '+who.npc.id:'ผู้เล่น','','เลือก "สู้" ร่วมกับ '+helpers.length+' คน — ตำรวจเข้าช่วยจับ');
 return {ok:1,m:'เริ่มต่อสู้กับผู้ก่อเหตุ ตำรวจกำลังเข้าช่วย'};
}
function fightTick(dt){
 for(const f of fights.slice()){
  const s=f.s;
  if(s.gone||!npcs.includes(s)){fights.splice(fights.indexOf(f),1);f.fs.forEach(q=>{q.fighting=0;q.fl&=~4096});continue}
  f.t+=dt;
  if(f.ph==='gather'){
   let there=0;
   for(const q of f.fs){
    if(q.gone)continue;
    if(Math.hypot(q.x-s.x,q.z-s.z)<1.8){there++;q.mode='still';q.route=[];q.st=0;q.ry=Math.atan2(s.x-q.x,s.z-q.z);q.fl|=4096}
    else if(!q.route.length){q.route=routeTo(q.x,q.z,s.x,s.z);q.mode='route';q.st=4}
   }
   let pl=false;
   if(f.peer&&room){const p=room.peers().find(r=>r.peer===f.peer);
    if(p&&p.presence&&Math.hypot(p.presence.x-s.x,p.presence.z-s.z)<2.8){pl=true;if(!f.pfx){f.pfx=1;emit('cmd',{to:f.peer,t:'fx',x:s.x+1.1,z:s.z,ry:-Math.PI/2,ms:7200})}}
    else if(!p)f.peer=null;}
   if(there>0||pl||f.t>9){f.ph='fight';f.tm=0;s.fl=(s.fl&~512)|8192;
    if(f.peer&&!f.pfx){f.pfx=1;emit('cmd',{to:f.peer,t:'fx',x:s.x+1.1,z:s.z,ry:-Math.PI/2,ms:7000})}
    f.fs.forEach(q=>{if(!q.gone&&q.route.length===0){q.fl|=4096}});}
  }else if(f.ph==='fight'){
   f.tm+=dt;
   s.ry+=dt*3;
   if(f.tm>=7){
    s.fl=(s.fl&~(8192|512))|16384;
    f.fs.forEach(q=>{q.fighting=0;q.fl&=~4096;q.mode='wander';q.st=0;q.tx=null;q.home=zoneOf(q.x,q.z)==='out'?'entr':zoneOf(q.x,q.z)});
    s.fightLock=0;if(f.police)f.police.claim=0;
    lg('evt','','','มัดตัวผู้ก่อเหตุสำเร็จ ตำรวจเข้าควบคุมตัว');
    fights.splice(fights.indexOf(f),1);arrestSuspect(s);
   }
  }
 }
}
/* ---- ประตูห้องปิดจริงเมื่อมีคนซ่อนอยู่ข้างใน ---- */
function doorLogic(){
 for(const k of DOORK){
  const room_=k.split('-')[0];let hid_=false;
  for(const n of npcs){if(!n.gone&&(n.fl&128)&&n.st===2&&!n.route.length&&zoneOf(n.x,n.z)===room_){hid_=true;break}}
  if(!hid_&&room)for(const p of room.peers()){const q=p.presence;if(q&&q.h&&ROLES[q.r]&&zoneOf(q.x,q.z)===room_){hid_=true;break}}
  applyDoor(k,hid_);
 }
}

let pending=[],apid=1;
function renderAppr(){
 const el=$('appr');if(!el)return;el.hidden=!pending.length||mode!=='admin';
 el.innerHTML=pending.map(a=>`<div class="apr"><div><b>${esc(a.who)}</b> <span class="pill">${esc(a.th)}</span></div><div>${esc(a.txt)}</div><div class="row"><button class="btn sm" data-ap="${a.id}" data-y="1">อนุมัติ</button><button class="btn sm red" data-ap="${a.id}" data-y="0">ปฏิเสธ</button></div></div>`).join('');
 el.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>approve(+b.dataset.ap,b.dataset.y==='1'));
}
function approve(id,yes,timeout){
 const i=pending.findIndex(a=>a.id===id);if(i<0)return;const a=pending.splice(i,1)[0];renderAppr();
 if(yes){execAct(a.msg,a.d)}
 else{
  reply(a.msg.peer,timeout?'หมดเวลา แอดมินไม่ได้ตอบ':'แอดมินไม่อนุมัติ',0);lg('miss',a.who,a.th,(timeout?'หมดเวลา: ':'แอดมินปฏิเสธ: ')+a.txt,0);
  if(a.d.c==='fight'){const p=room&&room.peers().find(q=>q.peer===a.msg.peer);if(p&&p.presence){const h=pickHide(p.presence.x,p.presence.z);emit('cmd',{to:a.msg.peer,t:'hide',x:h[0],z:h[1]})}}
 }
}

 if(role==='exec'){return {plan:'ขอเปิดใช้แผนเผชิญเหตุ',evac:'ขอสั่งอพยพทุกคน',support:'ขอกำลังสนับสนุนจากภายนอก'}[d.c]||'ขอใช้ปุ่มหน้าที่'}
 return {police:'ขอใช้หน้าที่: จับกุม/สอบถามผู้ต้องสงสัย',doctor:'ขอใช้หน้าที่: ตรวจรักษาผู้ป่วย',nurse:'ขอใช้หน้าที่: ปฐมพยาบาลและคัดแยก',guard:'ขอใช้หน้าที่: นำอพยพประชาชน',porter:'ขอสั่งเคลื่อนย้ายคนไข้และญาติ',assistant:'ขอสั่งเคลื่อนย้ายคนไข้และญาติ'}[role]||'ขอใช้ปุ่มหน้าที่';
}

function escortTick(dt){
 for(const e of escorts.slice()){
  if(e.s.fightLock)continue;
  if(e.ph==='go'){const d=Math.hypot(e.o.x-e.s.x,e.o.z-e.s.z);
   if(d<1.5){e.ph='lead';e.o.route=routeTo(e.o.x,e.o.z,9.8,20.2);e.s.route=routeTo(e.s.x,e.s.z,9.8,22.4);e.o.mode=e.s.mode='route';e.o.st=e.s.st=6}
   else if(!e.o.route.length){e.o.route=routeTo(e.o.x,e.o.z,e.s.x,e.s.z);e.o.mode='route';e.o.st=4}}
  else if(e.ph==='lead'){if(!esCar)esCar=newCar(CAR_IN,'in');
   if(!e.o.route.length&&!e.s.route.length&&esCar.ph==='park'){e.ph='load';e.t=0}}
  else if(e.ph==='load'){e.t+=dt;if(e.t>1.6){[e.o,e.s].forEach(q=>{q.gone=1;q.x=q.z=999});lg('evt','ตำรวจ','','นำตัว '+NT[e.s.tp].th+' '+e.s.id+' ขึ้นรถตำรวจและออกจากโรงพยาบาล');if(esCar){esCar.ph='out';esCar.wp=CAR_OUT;esCar.i=0;esCar.v=1;esCar.done=false}escorts.splice(escorts.indexOf(e),1)}}
 }
 if(esCar){
  if(esCar.ph==='in'||esCar.ph==='out'){stepCar(esCar,dt);if(esCar.done){if(esCar.ph==='in'){esCar.ph='park';esCar.v=0}else esCar=null}}
 }
}
/* player actions resolved by admin */
const nearest=(x,z,f,r)=>{let b=null,bd=r;for(const n of npcs){if(n.gone||!f(n))continue;const d=Math.hypot(n.x-x,n.z-z);if(d<bd){bd=d;b=n}}return b};
function reply(peer,m,ok){if(room)room.emit('res',{to:peer,m,ok:ok?1:0}).catch(()=>{})}
function adminAct(msg){
 const p=room.peers().find(q=>q.peer===msg.peer);if(!p||!p.presence||!ROLES[p.presence.r])return;
 const role=p.presence.r,who=p.presence.n||'ผู้เล่น',th=ROLES[role].th,d=msg.data||{};
 if(phase!=='run'){reply(msg.peer,'ยังไม่อยู่ในช่วงซ้อม',0);return}
 if(d.c==='flee'){RHF.run++;lg('evt',who,th,'เลือก "หนี" ออกจากอาคาร');return}
 if(d.c==='hide'){RHF.hide++;lg('evt',who,th,'เลือก "ซ่อน"');return}
 pending=pending.filter(a=>a.msg.peer!==msg.peer);
 const a={id:apid++,msg,d,who,th,txt:actLabel(role,d),t:Date.now()};pending.push(a);renderAppr();toast('มีคำขออนุมัติจาก '+who);
 reply(msg.peer,'ส่งคำขอให้แอดมินแล้ว รออนุมัติ...',1);
}
function execAct(msg,d){
 const p=room.peers().find(q=>q.peer===msg.peer);if(!p||!p.presence||!ROLES[p.presence.r])return;
 const role=p.presence.r,who=p.presence.n||'ผู้เล่น',x=p.presence.x,z=p.presence.z,th=ROLES[role].th;
 if(phase!=='run'){reply(msg.peer,'ยังไม่อยู่ในช่วงซ้อม',0);return}
 let ok=0,m='',det='';
 const med=n=>NT[n.tp].need==='med';
 if(d.c==='fight'){const r=startFight({peer:msg.peer,x,z});ok=r.ok;m=r.m;det=r.ok?'แอดมินอนุมัติ: ผู้เล่นร่วมต่อสู้กับผู้ก่อเหตุ':m}
 else if(role==='police'){const n=nearest(x,z,q=>q.tp==='suspect'&&!(q.fl&8),3.4);
  if(n){arrestSuspect(n);ok=1;m='จับกุม '+NT[n.tp].th+' '+n.id+' สำเร็จ';det=m}
  else m=nearest(x,z,q=>true,3)?'สอบถามแล้ว ไม่พบความผิดปกติ':'ไม่มีผู้ต้องสงสัยในระยะ'}
 else if(role==='doctor'){const n=nearest(x,z,q=>med(q)&&!(q.fl&1),3.2);
  if(n){n.fl|=1;ok=1;m='ตรวจรักษา '+NT[n.tp].th+' '+n.id+' แล้ว';det=m}else m='ไม่มีผู้ป่วยที่รอรักษาในระยะ'}
 else if(role==='nurse'&&d.c==='move'){const r=dispatchMove('pt',msg.peer);ok=r.ok;m=r.m;det=r.ok?'สั่งเคลื่อนย้ายคนไข้ไปโซนปลอดภัย':''}
 else if(role==='nurse'){const n=nearest(x,z,q=>med(q)&&!(q.fl&2),3.2);
  if(n){n.fl|=2;ok=1;const c=n.tp==='injured'?'แดง':n.tp==='patient'?'เขียว':'เหลือง';m='ปฐมพยาบาลและคัดแยก (สี'+c+') '+NT[n.tp].th+' '+n.id;det=m}else m='ไม่มีผู้ป่วยที่รอปฐมพยาบาลในระยะ'}
 else if(role==='guard'){let c=0;for(const n of npcs){if(CIV.includes(n.tp)&&n.st!==3&&!(n.fl&(4|8|64))&&Math.hypot(n.x-x,n.z-z)<6){n.fl&=~32;startEvac(n);c++}}
  if(c){ok=1;m='นำอพยพประชาชน '+c+' คน ไปจุดรวมพล';det=m}else m='ไม่มีผู้ที่ต้องอพยพในระยะ'}
 else if(role==='porter'||role==='assistant'){const r=dispatchMove('ptr',msg.peer);ok=r.ok;m=r.m;det=r.ok?'สั่งเคลื่อนย้ายคนไข้และญาติไปโซนปลอดภัย':''}
 else if(role==='exec'){const c=d.c,tx={plan:'เปิดใช้แผนเผชิญเหตุ',evac:'สั่งอพยพทุกคนไปจุดรวมพล',support:'ขอกำลังสนับสนุนจากภายนอก'}[c];
  if(tx){ok=1;m='ประกาศ: '+tx;det=tx;setBanner('ผู้บริหารสั่งการ: '+tx);if(c==='evac')evacAll()}else m='ยกเลิก'}
 lg(ok?'act':'miss',who,th,det||m,ok);
 reply(msg.peer,m,ok);
}

function compute(){
 const dur=(tEnd||Date.now())-(t0||Date.now());const evs=evTimes[0]||t0;
 const med=npcs.filter(n=>NT[n.tp].need==='med'),sus=npcs.filter(n=>n.tp==='suspect'),evn=npcs.filter(n=>n.ev||(n.fl&4));
 const pct=(a,b)=>b?Math.round(a/b*100):null;
 const cats=[];
 const add=(k,a,b)=>{if(b)cats.push({k,a,b,p:pct(a,b)})};
 add('ปฐมพยาบาล/คัดแยกผู้ป่วย',med.filter(n=>n.fl&2).length,med.length);
 add('แพทย์ตรวจรักษาผู้ป่วย',med.filter(n=>n.fl&1).length,med.length);
 if(moveEver)add('เคลื่อนย้ายคนไข้ไปโซนปลอดภัย',med.filter(n=>n.fl&4).length,med.length);
 add('จับกุมผู้ก่อเหตุ',sus.filter(n=>n.fl&8).length,sus.length);
 add('อพยพประชาชนถึงจุดรวมพล',evn.filter(n=>n.fl&4).length,evn.length);
 let ma=0,mb=0,lat=[];for(const m of msns){const el=[...roster.entries()].filter(([id,r])=>m.to==='all'||m.to===r.r);mb+=el.length;for(const [id] of el)if(m.acks[id]){ma++;lat.push(m.acks[id]-m.t)}}
 add('รับทราบภารกิจ',ma,mb);
 if(fireStart)add('ดับเพลิง',fires.length?0:1,1);
 const overall=cats.length?Math.round(cats.reduce((s,c)=>s+c.p,0)/cats.length):null;
 const roles=Object.keys(ROLES).map(k=>{const ps=[...roster.values()].filter(r=>r.r===k);const L=logs.filter(l=>l.role===ROLES[k].th&&(l.k==='act'||l.k==='miss'));const okL=L.filter(l=>l.k==='act');
  return {k,th:ROLES[k].th,n:ps.length,ok:okL.length,miss:L.length-okL.length,first:okL.length?Math.round((okL[0].t-evs)/1000):null}}).filter(r=>r.n);
 const obs=[];
 roles.forEach(r=>{if(!r.ok)obs.push('บทบาท'+r.th+'ยังไม่มีการปฏิบัติหน้าที่ที่ได้ผลเลย')});
 cats.filter(c=>c.p<60).forEach(c=>obs.push('ควรปรับปรุง: '+c.k+' ทำได้ '+c.a+' จาก '+c.b));
 if(lat.length){const av=Math.round(lat.reduce((a,b)=>a+b,0)/lat.length/1000);obs.push('เวลารับทราบภารกิจเฉลี่ย '+av+' วินาที')}
 if(fireStart&&fireOut)obs.push('ดับเพลิงได้ภายใน '+Math.round((fireOut-fireStart)/1000)+' วินาที');
 if(RHF.run+RHF.hide+RHF.fight)obs.push('NPC เลือก หนี '+RHF.run+' · ซ่อน '+RHF.hide+' · สู้ '+RHF.fight+' ครั้ง (หนี ซ่อน สู้)');
 if(!obs.length)obs.push('ไม่พบประเด็นที่ต้องปรับปรุงจากข้อมูลที่บันทึก');
 return {dur,cats,overall,roles,obs,players:roster.size};
}
function summaryHTML(){
 const c=compute(),grade=c.overall===null?'-':c.overall>=80?'ดีมาก':c.overall>=60?'ดี':'ควรปรับปรุง';
 let h=`<div class="row"><img src="${LOGO_H}" alt="" style="height:48px;width:48px"><h1 style="margin:0">สรุปผลการซ้อมแผน</h1></div><p class="sub">โรงพยาบาลดอนจาน · ใช้เวลา ${fmt(c.dur)} นาที · ผู้เข้าร่วม ${c.players} คน</p>
 <div class="row"><b style="font-size:34px">${c.overall===null?'-':c.overall+'%'}</b><span class="pill">${grade}</span></div>
 <h2>ผลตามภารกิจ</h2>${c.cats.map(x=>`<div><div class="row" style="justify-content:space-between"><span>${esc(x.k)}</span><b>${x.a}/${x.b}</b></div><div class="bar"><i style="width:${x.p}%"></i></div></div>`).join('')||'<p class="sub">ยังไม่มีข้อมูลภารกิจ</p>'}
 <h2>ผลตามอาชีพ</h2><div class="tw"><table><tr><th>อาชีพ</th><th>คน</th><th>ทำสำเร็จ</th><th>พลาด</th><th>แรกเริ่ม (วินาที)</th></tr>${c.roles.map(r=>`<tr><td>${esc(r.th)}</td><td>${r.n}</td><td>${r.ok}</td><td>${r.miss}</td><td>${r.first===null?'-':r.first}</td></tr>`).join('')}</table></div>
 <h2>ข้อสังเกตอัตโนมัติ</h2><ul>${c.obs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>
 <h2>ลำดับเหตุการณ์</h2><div class="tw"><table>${logs.filter(l=>l.k!=='join'||true).slice(-60).map(l=>`<tr><td>${fmt(l.t-(t0||l.t))}</td><td>${esc(l.who)} ${esc(l.role)}</td><td>${esc(l.d)}</td></tr>`).join('')}</table></div>`;
 return h;
}
function showSummary(){
 $('sumbody').innerHTML=summaryHTML()+'<h2>บันทึกของผู้ประเมิน</h2><textarea id="sumNotes" rows="3" placeholder="ข้อเสนอแนะ แผนปรับปรุง">'+esc(notes)+'</textarea>';
 $('sum').hidden=false;
}
$('sumClose').onclick=()=>{notes=($('sumNotes')||{}).value||notes;$('sum').hidden=true};
async function saveFile(name,data){
 if(!dlCap){toast('บันทึกไฟล์ไม่ได้ในมุมมองนี้');return}
 try{await dlCap.save({filename:name,data});toast('บันทึกแล้ว')}catch(e){if(e&&e.code!=='declined')toast('บันทึกไม่สำเร็จ')}}
$('sumExport').onclick=()=>{notes=($('sumNotes')||{}).value||notes;
 const css='body{font-family:sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1b2a47}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccd;padding:4px 6px;text-align:left}.bar{height:10px;background:#eef;border-radius:9px}.bar i{display:block;height:100%;background:#10b3a3;border-radius:9px}.row{display:flex;justify-content:space-between;gap:8px}.pill{border:1px solid #ccd;border-radius:9px;padding:1px 8px}';
 saveFile('สรุปผลซ้อมแผน.html','<!doctype html><meta charset="utf-8"><style>'+css+'</style>'+summaryHTML()+'<h2>บันทึกของผู้ประเมิน</h2><p>'+esc(notes).replace(/\n/g,'<br>')+'</p>')};
$('sumCsv').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 saveFile('log-ซ้อมแผน.csv','﻿เวลา,ประเภท,ผู้ใช้,อาชีพ,รายละเอียด,สำเร็จ\n'+logs.map(l=>[fmt(l.t-(t0||l.t)),l.k,l.who,l.role,l.d,l.ok].map(q).join(',')).join('\n'))};


/* ===== finale cutscene ===== */
const fin={on:false,t:0,objs:[],hid:[],car:null};
function mkCar(){
 const g=new T.Group(),b=(w,h,d,c,x,y,z)=>box(w,h,d,c,x,y,z,g);
 b(4.6,.8,2.1,0xffffff,0,.85,0);b(4.64,.3,2.14,0x1c2d6b,0,.5,0);b(2.2,.8,1.9,0xcfe8ff,-.2,1.65,0);b(2.25,.14,1.95,0xffffff,-.2,2.1,0);
 b(.15,.2,1.5,0x1c2d6b,2.3,.7,0);
 [[1.5,1.05],[1.5,-1.05],[-1.5,1.05],[-1.5,-1.05]].forEach(w=>{const m=new T.Mesh(new T.CylinderGeometry(.45,.45,.35,14),lam(0x222222));m.rotation.x=Math.PI/2;m.position.set(w[0],.45,w[1]);g.add(m)});
 [.55,-.55].forEach((z,i)=>{const m=new T.Mesh(new T.BoxGeometry(.5,.24,.5),new T.MeshBasicMaterial({color:i?0x2255ff:0xff2222}));m.position.set(-.2,2.3,z);g.add(m);g.userData[i?'blue':'red']=m});
 [.7,-.7].forEach(z=>{const m=new T.Mesh(new T.BoxGeometry(.1,.25,.35),new T.MeshBasicMaterial({color:0xffee88}));m.position.set(2.32,.95,z);g.add(m)});
 const l=mkLabel('ตำรวจ','#1c2d6b','#ffffff');fixLabel(l);l.position.set(0,3.4,0);g.add(l);
 return g}

/* ---- รถตำรวจวิ่งตามถนน ---- */
const CAR_IN=[[-80,40],[12,40],[12,21.6]];
const CAR_OUT=[[12,17.5],[24,17.5],[24,40],[60,40],[60,34.6]];
function newCar(wp,ph){return {x:wp[0][0],z:wp[0][1],th:0,i:1,v:ph==='in'?20:1,wp,ph,done:false}}
function stepCar(c,dt){
 const wp=c.wp;if(c.i>=wp.length){c.done=true;return}
 const last=c.i===wp.length-1,tg=wp[c.i],dx=tg[0]-c.x,dz=tg[1]-c.z,d=Math.hypot(dx,dz);
 const want=Math.atan2(-dz,dx);
 c.th=angLerp(c.th,want,Math.min(1,dt*(last?6:3.2)));
 let top=c.ph==='in'?22:14;
 if(!last&&d<7)top=Math.min(top,8);
 if(last)top=Math.min(top,1.2+d*1.4);
 c.v+=(top-c.v)*Math.min(1,dt*2.5);
 if(last){const k=Math.min(1,c.v*dt/Math.max(d,.01));c.x+=dx*k;c.z+=dz*k;if(d<.25){c.done=true;c.th=want}}
 else{c.x+=Math.cos(c.th)*c.v*dt;c.z+=-Math.sin(c.th)*c.v*dt;if(d<3)c.i++}
}
function playFinale(){
 if(fin.on)return;fin.on=true;fin.t=0;fin.endAt=null;fin.cp=null;
 fin.ui=[$('hud').hidden,$('adm').hidden];$('hud').hidden=true;$('adm').hidden=true;$('sum').hidden=true;$('fin').hidden=false;
 fin.hid=[];for(const v of npcView.values())if(v.tp==='suspect'&&v.g.visible){v.g.visible=false;fin.hid.push(v.g)}
 const car=mkCar();scene.add(car);fin.car=car;fin.cs=newCar(CAR_IN,'in');car.position.set(fin.cs.x,0,fin.cs.z);
 const A=mkChar('police',0),B=mkChar('police',1),S=mkChar('suspect',2);
 setTag(A,'ตำรวจ','#ffffff');setTag(B,'ตำรวจ','#ffffff');setTag(S,'ผู้ก่อเหตุ','#ffb4ac');setIcon(S,'🔗');
 [A,B,S].forEach(c=>{c.position.set(0,0,13.5);scene.add(c)});
 fin.A=A;fin.B=B;fin.S=S;fin.objs=[car,A,B,S];fin.lk=[8,26];
}
function endFinale(quiet){
 if(!fin.on)return;fin.on=false;fin.objs.forEach(o=>scene.remove(o));fin.objs=[];fin.hid.forEach(g=>g.visible=true);fin.hid=[];
 $('fin').hidden=true;
 if(mode==='admin'){$('adm').hidden=false;$('hud').hidden=false;if(!quiet)showSummary()}
 else{$('hud').hidden=false;if(!quiet)toast('จบการซ้อม ขอบคุณทุกท่าน',6000)}
}
$('finSkip').onclick=()=>endFinale();
function updateFinale(dt,t){
 fin.t+=dt;const T0=fin.t,cs=fin.cs,car=fin.car;
 if(cs.ph==='in'){stepCar(cs,dt);if(cs.done){cs.ph='park';cs.v=0}}
 else if(cs.ph==='park'&&T0>=9.5){cs.ph='out';cs.wp=CAR_OUT;cs.i=0;cs.v=1;cs.done=false}
 else if(cs.ph==='out'){stepCar(cs,dt);if(cs.done){cs.ph='gone';car.visible=false;fin.endAt=T0+1.6}}
 car.position.set(cs.x,0,cs.z);car.rotation.y=cs.th;
 const f=Math.floor(T0*4)%2;car.userData.red.visible=!!f;car.userData.blue.visible=!f;
 const u=T0<2.5?0:T0<7?(T0-2.5)/4.5:1,walking=u>0&&u<1;
 const put=(c,sx,ex,ez,vis)=>{c.visible=vis;const x=sx+(ex-sx)*u,z=13.5+(ez-13.5)*u;c.position.set(x,0,z);c.rotation.y=walking?Math.atan2(ex-sx,ez-13.5):Math.PI/2;animChar(c,walking?2.4:0,t,'')};
 put(fin.A,-1.4,9.8,19.4,T0<8.5);put(fin.S,0,9.8,21.4,T0<8.5);put(fin.B,1.4,9.8,23.4,T0<9.3);
 const cap=T0<2.5?'รถตำรวจกำลังมาที่โรงพยาบาล':cs.ph==='out'?'รถตำรวจนำตัวผู้ก่อเหตุไปสถานีตำรวจ':cs.ph==='gone'?'ถึงสถานีตำรวจ จบการซ้อม':T0<7?'ตำรวจควบคุมตัวผู้ก่อเหตุไปที่รถ':'นำตัวผู้ก่อเหตุขึ้นรถ';
 if($('fincap').textContent!==cap)$('fincap').textContent=cap;
 // กล้อง: ภาพกว้างตอนรถมา แล้วตามรถตอนออกไปสถานี
 const follow=cs.ph==='out'||cs.ph==='gone';
 const lx=follow?cs.x:8,lz=follow?cs.z:26,cx=follow?cs.x-9:-2,cz=follow?cs.z+16:52,cy=follow?9:11;
 const k=Math.min(1,dt*2.2);fin.lk[0]+=(lx-fin.lk[0])*k;fin.lk[1]+=(lz-fin.lk[1])*k;
 fin.cp=fin.cp||[cx,cz];fin.cp[0]+=(cx-fin.cp[0])*k;fin.cp[1]+=(cz-fin.cp[1])*k;
 camera.position.set(fin.cp[0],cy,fin.cp[1]);camera.lookAt(fin.lk[0],1.5,fin.lk[1]);
 if(fin.endAt!==null&&T0>=fin.endAt||T0>40){fin.cp=null;endFinale()}
}
